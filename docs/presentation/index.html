    let currentIndex = 0;
    const container = document.getElementById("slide-container");
    const currentSlideEl = document.getElementById("current-slide");
    const totalSlidesEl = document.getElementById("total-slides");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const progressBar = document.getElementById("progress-bar");
    const notesDrawer = document.getElementById("notes-drawer");
    const notesTitle = document.getElementById("notes-title");
    const notesContent = document.getElementById("notes-content");
    const toggleNotesBtn = document.getElementById("toggle-notes");
    const toggleFsBtn = document.getElementById("toggle-fs");
    const toggleThemeBtn = document.getElementById("toggle-theme");
    const themeIcon = document.getElementById("theme-icon");

    totalSlidesEl.textContent = slides.length;

    toggleThemeBtn.addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      document.documentElement.classList.toggle("light", !isDark);
      themeIcon.textContent = isDark ? "☀️ Light" : "🌙 Dark";
    });

    function renderSlide(index) {
      const slide = slides[index];
      container.innerHTML = slide.html;
      currentSlideEl.textContent = index + 1;
      
      const progressPercent = ((index + 1) / slides.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      prevBtn.disabled = index === 0;
      nextBtn.textContent = index === slides.length - 1 ? "Restart Deck ↺" : "Next Slide →";

      notesTitle.textContent = `Slide ${index + 1}: ${slide.title}`;
      notesContent.textContent = slide.notes;
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    prevBtn.addEventListener("click", prevSlide);
    nextBtn.addEventListener("click", () => {
      if (currentIndex === slides.length - 1) {
        currentIndex = 0;
      } else {
        currentIndex++;
      }
      renderSlide(currentIndex);
    });

    toggleNotesBtn.addEventListener("click", () => {
      notesDrawer.classList.toggle("hidden");
    });

    toggleFsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen().catch(console.error);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") {
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        prevSlide();
      } else if (e.key === "n" || e.key === "N") {
        notesDrawer.classList.toggle("hidden");
      } else if (e.key === "t" || e.key === "T") {
        toggleThemeBtn.click();
      } else if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(console.error);
        } else {
          document.exitFullscreen().catch(console.error);
        }
      }
    });

    renderSlide(0);
  </script>
