name: CareChain Enterprise CI Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  # 1. Smart Contracts Verification
  contracts-test:
    name: Smart Contracts & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Root Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Solidity Contracts
        run: bunx hardhat compile

      - name: Run Hardhat Test Suite
        run: bunx hardhat test

  # 2. Backend Validation
  backend-lint-and-check:
    name: Backend Gateway Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: bun install --frozen-lockfile

      - name: Verify Backend Syntax & Imports
        working-directory: ./backend
        run: node -c server.js

  # 3. Frontend Build & Production Check
  frontend-build:
    name: Frontend Production Bundle Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Build Production Frontend
        working-directory: ./frontend
        run: bun run build
        env:
          CI: false
